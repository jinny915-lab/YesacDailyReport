<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>YESAC Report Admin</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<header class="top">
  <h1>YESAC Daily Report · Admin</h1>
  <div class="sub">Qcells CTV Utilities – Maintenance Part · <a href="#" id="forgetKey" style="color:#fff">Forget key</a></div>
</header>

<main>
  <div id="keyBox" class="msg err hidden">
    Admin key required.
    <div style="display:flex;gap:8px;margin-top:8px"><input id="keyInput" type="password" placeholder="Admin key"><button id="keySave" class="primary">Save</button></div>
  </div>
  <div id="topMsg"></div>

  <!-- LIST -->
  <div id="listView">
    <section class="card">
      <h2>Reports</h2>
      <div class="grid noprint">
        <div><label>From</label><input type="date" id="fFrom"></div>
        <div><label>To</label><input type="date" id="fTo"></div>
        <div><label>Status</label><select id="fStatus"><option value="">All</option><option>Submitted</option><option>Reviewed</option><option>Returned</option></select></div>
        <div><label>Flags</label><select id="fFlag"><option value="">All</option><option value="ex">Has exception</option><option value="warn">Hours mismatch / late callout</option></select></div>
        <div style="align-self:end"><button class="primary" id="loadBtn">Load</button></div>
      </div>
    </section>
    <section class="card">
      <div id="summary" class="hint" style="margin-bottom:8px"></div>
      <div class="tablewrap"><table class="list" id="tbl">
        <thead><tr><th>Report no.</th><th>Prepared by</th><th>Crew/Task hrs</th><th>Exceptions</th><th>Photos</th><th>Status</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>
  </div>

  <!-- DETAIL -->
  <div id="detailView" class="hidden">
    <div class="noprint" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button id="backBtn">← List</button>
      <button id="printBtn">Print / PDF</button>
      <a id="folderLink" target="_blank" rel="noopener"><button>Open Drive folder</button></a>
    </div>
    <div id="detail"></div>
    <section class="card noprint">
      <h2>Review</h2>
      <div class="grid">
        <div><label>Status</label><select id="rvStatus"><option>Reviewed</option><option>Returned</option><option>Submitted</option></select></div>
      </div>
      <div style="margin-top:10px"><label>Comment (visible to Yesac)</label><textarea id="rvNote"></textarea></div>
      <div style="margin-top:10px"><button class="primary" id="rvSave">Save review</button></div>
    </section>
  </div>
</main>

<script>window.VIEW_MODE = 'admin';</script>
<script src="viewer.js"></script>
</body>
</html>
